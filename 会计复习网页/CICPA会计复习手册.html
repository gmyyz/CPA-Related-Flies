<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CICPA 会计复习手册</title>
  <style>
    :root {
      --bg: #f4efe7;
      --panel: rgba(255, 251, 245, 0.92);
      --ink: #1c160f;
      --muted: #6b5b49;
      --line: rgba(71, 51, 29, 0.14);
      --brand: #b6542a;
      --brand-deep: #7f2f16;
      --mint: #2f7d6b;
      --gold: #d8a946;
      --shadow: 0 18px 45px rgba(88, 54, 22, 0.12);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(214, 169, 84, 0.22), transparent 28%),
        radial-gradient(circle at top right, rgba(47, 125, 107, 0.16), transparent 22%),
        linear-gradient(180deg, #f8f3ec 0%, var(--bg) 100%);
    }

    .page-shell {
      width: min(1280px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .hero {
      padding: 38px;
      border: 1px solid var(--line);
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(255, 247, 236, 0.96), rgba(239, 225, 205, 0.78));
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1.02;
    }

    .hero-copy {
      max-width: 720px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }

    .hero-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .hero-meta span {
      padding: 10px 14px;
      border: 1px solid rgba(182, 84, 42, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.6);
      color: var(--brand-deep);
      font-size: 14px;
      font-weight: 600;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 20px;
      margin-top: 22px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .controls,
    .toolbar,
    .qa-card {
      padding: 22px;
    }

    .controls section + section {
      margin-top: 22px;
    }

    .controls h2,
    .toolbar h2,
    .section-block h4 {
      margin: 0 0 10px;
    }

    .field-label {
      display: block;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    input[type="search"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(28, 22, 15, 0.12);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.9);
      font-size: 15px;
    }

    input[type="search"]:focus {
      outline: 2px solid rgba(182, 84, 42, 0.22);
      border-color: rgba(182, 84, 42, 0.32);
    }

    .filter-list,
    .chip-list,
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-button,
    .chip,
    .tag {
      border: 1px solid rgba(28, 22, 15, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink);
    }

    .filter-button,
    .chip {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
    }

    .filter-button.active,
    .chip.active {
      border-color: transparent;
      background: linear-gradient(135deg, var(--brand), #d3733e);
      color: #fff;
    }

    .memory-box ul,
    .bullet {
      margin: 0;
      padding-left: 18px;
    }

    .memory-box li,
    .bullet li {
      line-height: 1.75;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .toolbar p,
    .results-meta,
    .question-summary {
      color: var(--muted);
    }

    .ghost-button {
      border: 1px solid rgba(28, 22, 15, 0.12);
      border-radius: 999px;
      background: #fff;
      padding: 10px 16px;
      cursor: pointer;
    }

    .results-meta {
      margin: 12px 2px 10px;
      font-size: 14px;
    }

    .card-list {
      display: grid;
      gap: 16px;
    }

    .qa-card {
      position: relative;
      overflow: hidden;
    }

    .qa-card::after {
      content: "";
      position: absolute;
      inset: auto -30px -30px auto;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(216, 169, 70, 0.18), transparent 70%);
    }

    .qa-topline {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .topic-badge,
    .difficulty-badge,
    .tag {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .topic-badge {
      background: rgba(47, 125, 107, 0.12);
      color: var(--mint);
      border-radius: 999px;
    }

    .difficulty-badge {
      background: rgba(216, 169, 70, 0.18);
      color: #8a6519;
      border-radius: 999px;
    }

    .question-title {
      margin: 0;
      font-size: 24px;
    }

    .question-summary {
      margin: 10px 0 0;
      line-height: 1.75;
    }

    .section-block {
      position: relative;
      z-index: 1;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed rgba(28, 22, 15, 0.12);
    }

    .tag {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.82);
    }

    .empty-state {
      padding: 38px;
      text-align: center;
    }

    .empty-state h3 {
      margin: 0 0 8px;
    }

    @media (max-width: 960px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .controls {
        order: 2;
      }
    }

    @media (max-width: 640px) {
      .page-shell {
        width: min(100% - 20px, 1280px);
      }

      .hero,
      .controls,
      .toolbar,
      .qa-card {
        padding: 18px;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <p class="eyebrow">CICPA Accounting Review</p>
      <h1>会计知识复习手册</h1>
      <p class="hero-copy">把平时问到的会计知识点整理成结构化卡片，方便按专题、关键词和考试易错点快速回看。</p>
      <div class="hero-meta">
        <span id="entry-count">0 个知识点</span>
        <span id="updated-at">更新时间 -</span>
      </div>
    </header>

    <main class="layout">
      <aside class="panel controls">
        <section>
          <h2>快速查找</h2>
          <label class="field-label" for="search-input">关键词</label>
          <input id="search-input" type="search" placeholder="搜索题目、结论、口诀、标签">
        </section>

        <section>
          <h2>专题筛选</h2>
          <div id="topic-filters" class="filter-list"></div>
        </section>

        <section>
          <h2>标签筛选</h2>
          <div id="tag-filters" class="chip-list"></div>
        </section>

        <section class="memory-box">
          <h2>复习建议</h2>
          <ul>
            <li>先看结论，再看原因，最后背口诀。</li>
            <li>易错点优先在做题前后各复习一次。</li>
            <li>考前一周按标签搜“少数股东损益”“内部交易”等高频关键词。</li>
          </ul>
        </section>
      </aside>

      <section class="content">
        <div class="panel toolbar">
          <div class="toolbar-copy">
            <h2>知识卡片</h2>
            <p>支持关键词搜索、专题筛选和标签定位。</p>
          </div>
          <button id="clear-filters" class="ghost-button" type="button">清空筛选</button>
        </div>

        <div id="results-meta" class="results-meta"></div>
        <div id="card-list" class="card-list"></div>
      </section>
    </main>
  </div>

  <template id="card-template">
    <article class="panel qa-card">
      <div class="qa-topline">
        <span class="topic-badge"></span>
        <span class="difficulty-badge"></span>
      </div>
      <h3 class="question-title"></h3>
      <p class="question-summary"></p>
      <div class="section-block">
        <h4>结论</h4>
        <ul class="bullet conclusion-list"></ul>
      </div>
      <div class="section-block">
        <h4>原因</h4>
        <ul class="bullet reasoning-list"></ul>
      </div>
      <div class="section-block">
        <h4>口诀</h4>
        <ul class="bullet memory-list"></ul>
      </div>
      <div class="section-block">
        <h4>易错点</h4>
        <ul class="bullet pitfalls-list"></ul>
      </div>
      <div class="tag-row"></div>
    </article>
  </template>

  <script>
    const studyData = {
      updatedAt: "2026-03-28",
      entries: [
        {
          id: "consolidation-downstream-minority-profit",
          topic: "合并财务报表",
          difficulty: "高频易错",
          question: "为什么顺流交易不影响少数股东损益？",
          summary: "顺流交易里未实现内部利润最初确认在母公司，所以合并抵销时冲减的是归母利润，而不是少数股东损益。",
          conclusion: [
            "顺流交易中，未实现内部利润最初确认在母公司。",
            "合并抵销时冲减的是归属于母公司的利润。",
            "少数股东损益通常不受影响。"
          ],
          reasoning: [
            "顺流交易是母公司向子公司销售。",
            "内部未实现利润先体现在母公司个别报表中，而不是子公司利润中。",
            "少数股东只分享子公司实现的净损益，不分享母公司虚增形成的内部利润。"
          ],
          memory: [
            "顺流看母公司，冲归母。",
            "逆流看子公司，归母少数一起冲。"
          ],
          pitfalls: [
            "不要只看货物在谁手里，要看未实现内部利润最初记在谁账上。",
            "顺流交易不影响少数股东损益，不代表所有相关项目都与少数股东完全无关。"
          ],
          tags: ["顺流交易", "少数股东损益", "内部交易抵销", "合并报表"]
        },
        {
          id: "consolidation-downstream-upstream-comparison",
          topic: "合并财务报表",
          difficulty: "高频基础",
          question: "顺流交易和逆流交易对少数股东损益的影响有什么区别？",
          summary: "核心差异在于未实现内部利润最初记在母公司还是子公司。来源在母公司时只冲归母，来源在子公司时归母和少数都要调。",
          conclusion: [
            "顺流交易：只影响归属于母公司净利润，不影响少数股东损益。",
            "逆流交易：影响归母净利润，也影响少数股东损益。"
          ],
          reasoning: [
            "顺流交易中，内部利润来自母公司，因此抵销时只影响归母净利润。",
            "逆流交易中，内部利润来自子公司，而子公司利润需要在合并中分拆为归母和少数股东两部分，因此少数股东损益也要调整。"
          ],
          memory: [
            "顺流利润在母，冲归母。",
            "逆流利润在子，母少同冲。"
          ],
          pitfalls: [
            "做题时不要只背方向，要先判断利润源头。",
            "逆流交易下，少数股东损益按持股比例调整。"
          ],
          tags: ["顺流交易", "逆流交易", "少数股东损益", "归母净利润"]
        },
        {
          id: "fixed-assets-internal-trade-core-logic",
          topic: "合并财务报表",
          difficulty: "高频提高",
          question: "固定资产内部交易是否也遵循同样逻辑？",
          summary: "遵循同样逻辑，仍然看内部损益最初记在哪一方。只是固定资产题目比存货多一步折旧调整。",
          conclusion: [
            "固定资产内部交易也遵循相同逻辑，仍然看未实现内部损益最初记在谁那里。",
            "顺流固定资产交易通常只影响归母净利润，不影响少数股东损益。",
            "逆流固定资产交易会影响归母净利润和少数股东损益。"
          ],
          reasoning: [
            "固定资产内部交易同样属于集团内部未对外实现的损益。",
            "合并报表需要抵销内部处置损益，并将固定资产账面价值调回集团角度的原账面价值。",
            "由于资产在后续期间继续使用，还要同步调整后续多提或少提的折旧。"
          ],
          memory: [
            "存货看未实现利润，固定资产看未实现损益加折旧调整。",
            "顺流仍冲归母，逆流仍母少同冲。"
          ],
          pitfalls: [
            "固定资产内部交易不能只做一笔处置损益抵销，还要记得折旧调整。",
            "做题时要从出售当期和后续期间两个阶段看。"
          ],
          tags: ["固定资产内部交易", "折旧调整", "顺流交易", "逆流交易"]
        },
        {
          id: "downstream-fixed-assets-depreciation",
          topic: "合并财务报表",
          difficulty: "高频易错",
          question: "顺流固定资产交易中，多抵销的折旧会影响少数股东损益吗？",
          summary: "一般不影响。多提折旧本质上是母公司前期内部虚增利润在后续期间的延续影响，因此通常仍然归属于母公司调整。",
          conclusion: [
            "顺流固定资产交易中，多抵销的折旧一般不影响少数股东损益。"
          ],
          reasoning: [
            "顺流交易中，内部固定资产交易的虚增利润最初来自母公司。",
            "子公司后续多提折旧，是因为其按内部交易价格入账，属于前期母公司内部未实现损益的后续影响。",
            "合并报表冲回多提折旧，本质上是在继续纠正母公司形成的内部虚增，因此通常归属于母公司。"
          ],
          memory: [
            "顺流交易下，利润和折旧修正都看母公司。",
            "因此一般不影响少数股东损益。"
          ],
          pitfalls: [
            "不要把子公司账上多提折旧误判为少数股东一定要分担。",
            "关键仍然是这笔差异的源头在母公司。"
          ],
          tags: ["固定资产内部交易", "折旧调整", "少数股东损益", "顺流交易"]
        }
      ]
    };

    const state = {
      search: "",
      topic: "全部",
      tag: "全部"
    };

    const searchInput = document.querySelector("#search-input");
    const topicFilters = document.querySelector("#topic-filters");
    const tagFilters = document.querySelector("#tag-filters");
    const cardList = document.querySelector("#card-list");
    const resultsMeta = document.querySelector("#results-meta");
    const entryCount = document.querySelector("#entry-count");
    const updatedAt = document.querySelector("#updated-at");
    const clearFiltersButton = document.querySelector("#clear-filters");
    const cardTemplate = document.querySelector("#card-template");

    function uniqueValues(values) {
      return ["全部", ...new Set(values)];
    }

    function normalizeText(value) {
      return value.toLowerCase().trim();
    }

    function matchesFilters(entry) {
      const topicMatch = state.topic === "全部" || entry.topic === state.topic;
      const tagMatch = state.tag === "全部" || entry.tags.includes(state.tag);
      const haystack = [
        entry.question,
        entry.summary,
        ...entry.conclusion,
        ...entry.reasoning,
        ...entry.memory,
        ...entry.pitfalls,
        ...entry.tags
      ].join(" ").toLowerCase();
      const searchMatch = !state.search || haystack.includes(state.search);
      return topicMatch && tagMatch && searchMatch;
    }

    function renderFilterGroup(container, values, activeValue, variant, onClick) {
      container.innerHTML = "";
      values.forEach((value) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = value;
        button.className = variant;
        if (value === activeValue) {
          button.classList.add("active");
        }
        button.addEventListener("click", () => onClick(value));
        container.appendChild(button);
      });
    }

    function renderCards(entries) {
      cardList.innerHTML = "";

      if (!entries.length) {
        const empty = document.createElement("div");
        empty.className = "panel empty-state";
        empty.innerHTML = "<h3>没有找到匹配内容</h3><p>试试清空筛选，或者换一个关键词。</p>";
        cardList.appendChild(empty);
        return;
      }

      entries.forEach((entry) => {
        const fragment = cardTemplate.content.cloneNode(true);
        fragment.querySelector(".topic-badge").textContent = entry.topic;
        fragment.querySelector(".difficulty-badge").textContent = entry.difficulty;
        fragment.querySelector(".question-title").textContent = entry.question;
        fragment.querySelector(".question-summary").textContent = entry.summary;

        const mapping = [
          [".conclusion-list", entry.conclusion],
          [".reasoning-list", entry.reasoning],
          [".memory-list", entry.memory],
          [".pitfalls-list", entry.pitfalls]
        ];

        mapping.forEach(([selector, items]) => {
          const list = fragment.querySelector(selector);
          list.innerHTML = items.map((item) => `<li>${item}</li>`).join("");
        });

        const tagRow = fragment.querySelector(".tag-row");
        entry.tags.forEach((tag) => {
          const span = document.createElement("span");
          span.className = "tag";
          span.textContent = tag;
          tagRow.appendChild(span);
        });

        cardList.appendChild(fragment);
      });
    }

    function renderFilters() {
      const topics = uniqueValues(studyData.entries.map((entry) => entry.topic));
      const tags = uniqueValues(studyData.entries.flatMap((entry) => entry.tags));

      renderFilterGroup(topicFilters, topics, state.topic, "filter-button", (value) => {
        state.topic = value;
        renderAll();
      });

      renderFilterGroup(tagFilters, tags, state.tag, "chip", (value) => {
        state.tag = value;
        renderAll();
      });
    }

    function renderAll() {
      renderFilters();
      const filteredEntries = studyData.entries.filter(matchesFilters);
      renderCards(filteredEntries);
      resultsMeta.textContent = `当前显示 ${filteredEntries.length} / ${studyData.entries.length} 个知识点`;
      entryCount.textContent = `${studyData.entries.length} 个知识点`;
      updatedAt.textContent = `更新时间 ${studyData.updatedAt}`;
    }

    searchInput.addEventListener("input", (event) => {
      state.search = normalizeText(event.target.value);
      renderAll();
    });

    clearFiltersButton.addEventListener("click", () => {
      state.search = "";
      state.topic = "全部";
      state.tag = "全部";
      searchInput.value = "";
      renderAll();
    });

    renderAll();
  </script>
</body>
</html>
